name: PHP Checks

on:
  push:
    branches: [ main, develop, 'cursor/**' ]
  pull_request:
    branches: [ main, develop ]

jobs:
  syntax-check:
    name: PHP Syntax Check
    runs-on: ubuntu-latest

    strategy:
      matrix:
        php-version: ['7.4', '8.0', '8.1', '8.2', '8.3']

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php-version }}
        coverage: none

    - name: Check PHP syntax
      run: |
        find . -name "*.php" -not -path "./vendor/*" -print0 | xargs -0 -n1 php -l

    - name: Run smoke tests
      run: php tests/smoke-test.php

  phpcs:
    name: PHPCS - WordPress-Extra
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        tools: composer, cs2pr

    - name: Get Composer cache directory
      id: composer-cache
      run: echo "dir=$(composer config cache-files-dir --no-interaction)" >> "$GITHUB_OUTPUT"

    - name: Cache Composer dependencies
      uses: actions/cache@v4
      with:
        path: ${{ steps.composer-cache.outputs.dir }}
        key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
        restore-keys: ${{ runner.os }}-composer-

    - name: Install PHPCS and WordPress Coding Standards
      run: composer install --no-progress --no-interaction --prefer-dist

    - name: Show PHPCS configuration
      run: |
        vendor/bin/phpcs --version
        vendor/bin/phpcs -i

    - name: Run PHPCS
      run: |
        set -o pipefail
        vendor/bin/phpcs -q --standard=WordPress-Extra --report=checkstyle | cs2pr

  phpunit:
    name: PHPUnit
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        tools: composer
        extensions: mysqli
        coverage: none

    - name: Install Composer dependencies
      run: composer install --no-progress --no-interaction --prefer-dist

    - name: Run unit tests
      run: vendor/bin/phpunit --testsuite unit

    - name: Install Subversion
      run: sudo apt-get update && sudo apt-get install -y subversion

    - name: Install WordPress test suite
      run: bash bin/install-wp-tests.sh wordpress_test root root 127.0.0.1 latest

    - name: Run integration tests
      env:
        WP_TESTS_DIR: /tmp/wordpress-tests-lib
      run: vendor/bin/phpunit --testsuite integration

  plugin-check:
    name: WordPress Plugin Check
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run Plugin Check
      uses: wordpress/plugin-check-action@v1
      with:
        build-dir: './'
        slug: oli-duplicate-post
        exclude-directories: |
          tests
          vendor
          artifacts
          .github
          bin
        include-experimental: false
